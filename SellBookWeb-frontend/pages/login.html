<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng bán sách - Đăng nhập</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="login-header">
                <h1>📚 Cửa Hàng Sách</h1>
                <p>Quản lý cửa hàng bán sách trực tuyến</p>
            </div>

            <div class="error" id="errorMessage"></div>

            <div class="toggle-form">
                <button class="toggle-btn active" onclick="toggleForm('login')">Đăng nhập</button>
                <button class="toggle-btn" onclick="toggleForm('register')">Đăng ký</button>
            </div>

            <form id="loginForm" class="form-container active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="loginPassword" required minlength="6">
                </div>

                <button type="submit" class="submit-btn" id="loginBtn">Đăng nhập</button>
            </form>

            <form id="registerForm" class="form-container" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Tên:</label>
                    <input type="text" id="registerName" required minlength="2">
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="registerEmail" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="registerPassword" required minlength="6">
                </div>

                <div class="form-group">
                    <label>Xác nhận mật khẩu:</label>
                    <input type="password" id="registerPasswordConfirm" required minlength="6">
                </div>

                <div class="form-group">
                    <label>Điện thoại:</label>
                    <input type="tel" id="registerPhone" pattern="[0-9]{10}">
                </div>

                <button type="submit" class="submit-btn" id="registerBtn">Đăng ký</button>
            </form>
        </div>
    </div>

    <script src="../js/constants.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
